<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Parking - Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; }
        .auth-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="auth-card">
                    <h3 class="text-center text-primary mb-4">🅿️ Smart Parking Access</h3>
                    
                    <div class="tabs mb-3">
                        <button class="btn btn-outline-primary btn-sm" onclick="showSection('login')">Existing User</button>
                        <button class="btn btn-outline-success btn-sm" onclick="showSection('reg')">New User</button>
                    </div>

                    <div id="loginSection">
                        <div class="mb-3">
                            <label class="form-label">Enter your User ID</label>
                            <input type="number" id="loginId" class="form-control" placeholder="e.g. 1">
                        </div>
                        <button onclick="login()" class="btn btn-primary w-100">Enter Dashboard</button>
                    </div>

                    <div id="regSection" style="display:none;">
                        <input type="text" id="regName" class="form-control mb-2" placeholder="Full Name">
                        <input type="email" id="regEmail" class="form-control mb-2" placeholder="Email Address">
                        <input type="number" id="regBalance" class="form-control mb-3" placeholder="Initial Balance ($)">
                        <button onclick="register()" class="btn btn-success w-100">Register & Enter</button>
                    </div>
                    
                    <div id="msg" class="mt-3 text-center small text-danger"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showSection(type) {
            document.getElementById('loginSection').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('regSection').style.display = type === 'reg' ? 'block' : 'none';
        }

        async function login() {
            const id = document.getElementById('loginId').value;
            if(!id) return;
            // Store ID in browser memory and redirect
            localStorage.setItem('activeUserId', id);
            window.location.href = "index.html";
        }

        async function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const balance = document.getElementById('regBalance').value;

            try {
                const response = await fetch('/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, balance: parseFloat(balance) })
                });
                const user = await response.json();
                localStorage.setItem('activeUserId', user.id);
                window.location.href = "index.html";
            } catch (err) {
                document.getElementById('msg').innerText = "Registration failed!";
            }
        }
    </script>
</body>
</html>
