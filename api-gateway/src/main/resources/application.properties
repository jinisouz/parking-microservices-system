# Gateway Port
server.port=9191
spring.application.name=api-gateway

# Eureka Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- EXPERIMENTAL WEBFLUX ROUTING FORMAT ---

# 1. User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

# 2. Parking Service
spring.cloud.gateway.server.webflux.routes[1].id=parking-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PARKING-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/parking/**

# 3. Booking Service
spring.cloud.gateway.server.webflux.routes[2].id=booking-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/bookings/**

# Discovery Settings
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Debugging (Keep this on to see if routes load)
logging.level.org.springframework.cloud.gateway=DEBUG